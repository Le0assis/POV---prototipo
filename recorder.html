<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POV - Gravador & Telemetria de Sensores</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: #1e293b; border-radius: 16px; padding: 18px; border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-bottom: 10px; font-size: 1.3rem; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        label { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; font-weight: bold; }
        select { background: #0f172a; color: #f8fafc; border: 1px solid #0284c7; padding: 10px; border-radius: 8px; font-size: 0.95rem; outline: none; }
        
        .btn-record { background: #22c55e; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-record.recording { background: #ef4444; }
        
        /* Painel de Telemetria */
        .sensor-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .sensor-box { background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #1e293b; }
        .sensor-title { font-size: 0.75rem; color: #38bdf8; font-weight: bold; margin-bottom: 4px; text-transform: uppercase; }
        .sensor-value { font-family: monospace; font-size: 0.82rem; color: #f1f5f9; line-height: 1.3; }
        .gyro-status { grid-column: span 2; padding: 8px; border-radius: 6px; text-align: center; font-size: 0.8rem; font-weight: bold; }
        .gyro-active { background: #065f46; color: #34d399; }
        .gyro-inactive { background: #854d0e; color: #fde047; }

        .alert { background: #0284c7; color: white; padding: 12px; border-radius: 8px; font-size: 0.85rem; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>📱 Captura & Telemetria Indoor</h2>
        
        <div class="form-group">
            <label for="src-select">Origem:</label>
            <select id="src-select"><option value="">Carregando nós...</option></select>
        </div>

        <div class="form-group">
            <label for="tgt-select">Destino:</label>
            <select id="tgt-select"><option value="">Carregando nós...</option></select>
        </div>

        <button id="record-btn" class="btn-record" onclick="toggleRecording()">▶️ Iniciar Captura</button>
    </div>

    <!-- PAINEL DE MONITORAMENTO EM TEMPO REAL -->
    <div class="card">
        <h2>📊 Monitor de Sensores em Tempo Real</h2>
        
        <div class="sensor-panel">
            <div id="gyro-badge" class="gyro-status gyro-inactive">Giroscópio: Aguardando Movimento...</div>

            <div class="sensor-box">
                <div class="sensor-title">Aceleração (m/s²)</div>
                <div class="sensor-value" id="acc-val">X: 0.00<br>Y: 0.00<br>Z: 0.00<br><b>Mag: 0.00</b></div>
            </div>

            <div class="sensor-box">
                <div class="sensor-title">Giroscópio (rad/s)</div>
                <div class="sensor-value" id="gyro-val">X: 0.00<br>Y: 0.00<br>Z: 0.00<br><b>Mag: 0.00</b></div>
            </div>

            <div class="sensor-box" style="grid-column: span 2;">
                <div class="sensor-title">Orientação / Bússola (Graus)</div>
                <div class="sensor-value" id="mag-val">Alpha (Yaw): 0° | Beta: 0° | Gamma: 0°</div>
            </div>

            <div class="sensor-box" style="grid-column: span 2;">
                <div class="sensor-title">Amostras Coletadas</div>
                <div class="sensor-value" id="sample-count" style="font-size: 1.2rem; color: #38bdf8;">0</div>
            </div>
        </div>
    </div>
    
    <div id="status-msg" class="alert" style="display: none;"></div>
</div>
<script>
    // Detecta se a página foi aberta via HTTP ou arquivo local (file://)
    const API_BASE_URL = window.location.protocol.startsWith('http') 
        ? "" 
        : "http://127.0.0.1:8000"; 

    let isRecording = false;
    let rawSamples = [];
    let currentMag = { alpha: 0, beta: 0, gamma: 0 };
    let gyroHasData = false;

    // Função universal para carregar os nós com tratamento de erros reforçado
    async function loadNodes() {
        const srcSel = document.getElementById('src-select');
        const tgtSel = document.getElementById('tgt-select');

        try {
            console.log("[SISTEMA] Solicitando mapa em:", `${API_BASE_URL}/api/map`);
            const res = await fetch(`${API_BASE_URL}/api/map`);

            if (!res.ok) {
                throw new Error(`Servidor respondeu com status ${res.status}`);
            }

            const data = await res.json();
            console.log("[SISTEMA] Resposta recebida do /api/map:", data);

            srcSel.innerHTML = '<option value="">Selecione a Origem</option>';
            tgtSel.innerHTML = '<option value="">Selecione o Destino</option>';

            // Converte os nós recebidos para lista, seja Array ou Dicionário
            let nodesList = [];
            if (Array.isArray(data.nodes)) {
                nodesList = data.nodes;
            } else if (data.nodes && typeof data.nodes === 'object') {
                nodesList = Object.keys(data.nodes);
            }

            if (nodesList.length === 0) {
                showStatus("⚠️ Banco conectado, mas nenhum checkpoint foi encontrado. Cadastre checkpoints primeiro.");
                return;
            }

            // Popula os seletores com os nomes dos nós
            nodesList.forEach(node => {
                const nodeName = typeof node === 'object' ? (node.name || node.id) : node;
                srcSel.innerHTML += `<option value="${nodeName}">${nodeName}</option>`;
                tgtSel.innerHTML += `<option value="${nodeName}">${nodeName}</option>`;
            });

            showStatus("✅ Nós do mapa carregados com sucesso!");

        } catch (err) {
            console.error("[ERRO CRÍTICO] Falha ao carregar nós:", err);
            srcSel.innerHTML = '<option value="">Erro ao carregar</option>';
            tgtSel.innerHTML = '<option value="">Erro ao carregar</option>';
            showStatus("❌ Erro de conexão com a API. Verifique o console (F12) e acesse via http://localhost:8000");
        }
    }

    async function toggleRecording() {
        const btn = document.getElementById('record-btn');
        const src = document.getElementById('src-select').value;
        const tgt = document.getElementById('tgt-select').value;

        if (!isRecording) {
            if (!src || !tgt || src === tgt) {
                alert("Selecione Origem e Destino válidos.");
                return;
            }

            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try { await DeviceMotionEvent.requestPermission(); } catch (e) {}
            }
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try { await DeviceOrientationEvent.requestPermission(); } catch (e) {}
            }

            await fetch(`${API_BASE_URL}/api/reset`, { method: 'POST' });
            rawSamples = [];
            isRecording = true;

            window.addEventListener('devicemotion', handleMotion);
            window.addEventListener('deviceorientation', handleOrientation);

            btn.innerText = "⏹️ Parar e Enviar para Processamento";
            btn.classList.add('recording');
            showStatus("Gravando e exibindo sensores...");
        } else {
            window.removeEventListener('devicemotion', handleMotion);
            window.removeEventListener('deviceorientation', handleOrientation);

            isRecording = false;
            btn.innerText = "▶️ Iniciar Captura";
            btn.classList.remove('recording');

            await sendRawSamplesToBackend(src, tgt, rawSamples);
        }
    }

    function handleMotion(event) {
        const acc = event.accelerationIncludingGravity || event.acceleration;
        const rot = event.rotationRate;

        if (!acc || acc.x === null) return;

        let gxDeg = 0.0, gyDeg = 0.0, gzDeg = 0.0;
        if (rot) {
            gxDeg = rot.alpha ?? rot.x ?? 0.0;
            gyDeg = rot.beta ?? rot.y ?? 0.0;
            gzDeg = rot.gamma ?? rot.z ?? 0.0;
        }

        const gxRad = gxDeg * (Math.PI / 180.0);
        const gyRad = gyDeg * (Math.PI / 180.0);
        const gzRad = gzDeg * (Math.PI / 180.0);

        const accMag = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
        const gyroMag = Math.sqrt(gxRad**2 + gyRad**2 + gzRad**2);

        const gyroBadge = document.getElementById('gyro-badge');
        if (gyroMag > 0.05) {
            gyroHasData = true;
            gyroBadge.className = "gyro-status gyro-active";
            gyroBadge.innerText = "Giroscópio: ATIVO (Capturando rotação)";
        } else if (!gyroHasData) {
            gyroBadge.className = "gyro-status gyro-inactive";
            gyroBadge.innerText = "Giroscópio: ZERADO (Aguardando movimento/permissão)";
        }

        document.getElementById('acc-val').innerHTML = 
            `X: ${acc.x.toFixed(2)} | Y: ${acc.y.toFixed(2)} | Z: ${acc.z.toFixed(2)}<br><b>Mag: ${accMag.toFixed(2)} m/s²</b>`;
        
        document.getElementById('gyro-val').innerHTML = 
            `X: ${gxRad.toFixed(2)} | Y: ${gyRad.toFixed(2)} | Z: ${gzRad.toFixed(2)}<br><b>Mag: ${gyroMag.toFixed(2)} rad/s</b>`;

        if (isRecording) {
            const timestamp = Date.now() / 1000.0;
            rawSamples.push({
                timestamp: timestamp,
                accel_x: acc.x || 0.0,
                accel_y: acc.y || 0.0,
                accel_z: acc.z || 0.0,
                gyro_x: gxRad,
                gyro_y: gyRad,
                gyro_z: gzRad,
                mag_x: currentMag.alpha,
                mag_y: currentMag.beta,
                mag_z: currentMag.gamma
            });

            document.getElementById('sample-count').innerText = `${rawSamples.length}`;
        }
    }

    function handleOrientation(event) {
        currentMag.alpha = event.alpha || 0.0;
        currentMag.beta = event.beta || 0.0;
        currentMag.gamma = event.gamma || 0.0;

        document.getElementById('mag-val').innerText = 
            `Alpha (Yaw): ${currentMag.alpha.toFixed(1)}° | Beta: ${currentMag.beta.toFixed(1)}° | Gamma: ${currentMag.gamma.toFixed(1)}°`;
    }

    async function sendRawSamplesToBackend(source, target, samples) {
        if (samples.length < 20) {
            alert("Gravação muito curta.");
            return;
        }

        showStatus("Processando no backend Python...");

        try {
            const res = await fetch(`${API_BASE_URL}/api/edges/process-raw`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ source, target, samples })
            });

            const data = await res.json();

            if (res.ok) {
                if (data.status === "warning" || data.steps_count === 0) {
                    alert("⚠️ Trecho Descartado!\nChacoalhado ou movimento não humano detectado.");
                    showStatus("Descartado: Apenas chacoalhado detectado.");
                } else {
                    alert(`✅ Trecho Processado!\nPassos: ${data.steps_count}\nDistância: ${data.distance_m}m`);
                    showStatus("Salvo com sucesso!");
                }
            } else {
                alert(`Erro: ${data.detail}`);
            }
        } catch (err) {
            alert("Erro ao conectar à API.");
        }
    }

    function showStatus(msg) {
        const el = document.getElementById('status-msg');
        el.innerText = msg;
        el.style.display = 'block';
    }

    // Garante a execução da busca assim que a estrutura da página carrega
    document.addEventListener("DOMContentLoaded", () => {
        window.addEventListener('devicemotion', handleMotion);
        window.addEventListener('deviceorientation', handleOrientation);
        loadNodes();
    });
</script> 
</body>
</html>
