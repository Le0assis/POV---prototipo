name: backend-tests

# PRs para main e dev, e push nessas branches.
# numpy 2.4 e scipy 1.17 não publicam wheel para CPython 3.10;
# o job usa 3.11, que é a versão mínima em que o requirements.txt instala.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Pytest (unit e integration)
        working-directory: Backend
        run: pytest -m "unit or integration" -q
