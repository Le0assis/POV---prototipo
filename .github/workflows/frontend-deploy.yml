name: CI/CD Pipeline - POV Indoor

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev", "cursor/**" ]

jobs:
  # JOB 1: Testes e validações do código Python (dev e main)
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verificar erros de sintaxe Python
        run: |
          python -m compileall .

  # JOB 2: Testes Node do frontend em pull request (main, dev e cursor/**)
  frontend-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar testes do frontend
        run: npm test

  # JOB 3: Publica a pasta frontend na branch 'gh-pages' (Apenas no push da 'main')
  deploy-github-pages:
    needs: test-and-validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Publicar pasta frontend na branch gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend
          publish_branch: gh-pages
          cname: pov-unimar.com
          force_orphan: true