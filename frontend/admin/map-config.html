<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
    (function () {
        try {
            var raw = localStorage.getItem('pov.a11y');
            if (!raw) return;
            var prefs = JSON.parse(raw);
            var root = document.documentElement;
            if (prefs && prefs.hc) root.classList.add('hc');
            if (prefs && prefs.fontLg) root.classList.add('font-lg');
            if (prefs && prefs.dark) root.classList.add('dark');
        } catch (e) { /* preferência ausente: segue o tema padrão */ }
    })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POV — Configurar planta</title>
    <meta name="description" content="Define a imagem da planta, os pixels por metro e a rotação do mapa.">
    <link rel="canonical" href="https://pov-unimar.com/admin/map-config.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="POV">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:title" content="POV — Configurar planta">
    <meta property="og:description" content="Define a imagem da planta, os pixels por metro e a rotação do mapa.">
    <meta property="og:url" content="https://pov-unimar.com/admin/map-config.html">
    <meta property="og:image" content="https://pov-unimar.com/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="POV, mapa do prédio com a rota em azul e o destino em âmbar.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="POV — Configurar planta">
    <meta name="twitter:description" content="Define a imagem da planta, os pixels por metro e a rotação do mapa.">
    <meta name="twitter:url" content="https://pov-unimar.com/admin/map-config.html">
    <meta name="twitter:image" content="https://pov-unimar.com/og.png">
    <meta name="twitter:image:alt" content="POV, mapa do prédio com a rota em azul e o destino em âmbar.">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/home.css">
</head>
<body>
    <header class="admin-header" id="admin-header">
        <a class="admin-menu-link" href="index.html">Menu da administração</a>
    </header>
    <main class="home hidden" id="map-config-app">
        <h1>Configurar planta</h1>
        <form class="card" id="form-map-config" novalidate>
            <label class="form-group" for="plan-image">
                Caminho da imagem
                <input id="plan-image" name="plan_image" type="text" placeholder="assets/planta.png" autocomplete="off">
            </label>
            <p class="hint">Caminho relativo ao frontend, servido junto com as páginas. Sem upload.</p>
            <label class="form-group" for="px-per-m">
                Pixels por metro
                <input id="px-per-m" name="px_per_m" type="number" step="0.01" inputmode="decimal">
            </label>
            <label class="form-group" for="rotation-deg">
                Rotação da planta (graus, anti-horário)
                <input id="rotation-deg" name="rotation_deg" type="number" step="0.1" value="0">
            </label>
            <p class="hint">rotation_rad: <span class="mono" id="rotation-rad">0.0000</span></p>
            <p class="hint" id="map-config-error" role="alert"></p>
            <button type="submit" class="btn btn-primary">Salvar planta</button>
        </form>
    </main>
    <script type="module" src="/src/boot.ts"></script>
    <script type="module" src="/src/pages/map-config.ts"></script>
</body>
</html>
