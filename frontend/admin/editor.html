<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
    (function () {
        try {
            var raw = localStorage.getItem('pov.a11y');
            if (!raw) return;
            var prefs = JSON.parse(raw);
            var root = document.documentElement;
            if (prefs && prefs.hc) root.classList.add('hc');
            if (prefs && prefs.fontLg) root.classList.add('font-lg');
            if (prefs && prefs.dark) root.classList.add('dark');
        } catch (e) { /* preferência ausente: segue o tema padrão */ }
    })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POV — Editor</title>
    <meta name="description" content="Cria checkpoints e conexões e grava a posição de cada ponto na planta.">
    <link rel="canonical" href="https://pov-unimar.com/admin/editor.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="POV">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:title" content="POV — Editor">
    <meta property="og:description" content="Cria checkpoints e conexões e grava a posição de cada ponto na planta.">
    <meta property="og:url" content="https://pov-unimar.com/admin/editor.html">
    <meta property="og:image" content="https://pov-unimar.com/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="POV, mapa do prédio com a rota em azul e o destino em âmbar.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="POV — Editor">
    <meta name="twitter:description" content="Cria checkpoints e conexões e grava a posição de cada ponto na planta.">
    <meta name="twitter:url" content="https://pov-unimar.com/admin/editor.html">
    <meta name="twitter:image" content="https://pov-unimar.com/og.png">
    <meta name="twitter:image:alt" content="POV, mapa do prédio com a rota em azul e o destino em âmbar.">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/map.css">
</head>
<body>
    <header class="admin-header" id="admin-header">
        <a class="admin-menu-link" href="index.html">Menu da administração</a>
    </header>
    <main class="map-page">
        <div class="hidden" id="editor-app">
            <div class="map-layout">
                <section>
                    <div class="map-toolbar">
                        <div class="title-row">
                            <h1>Editar mapa e pontos</h1>
                        </div>
                        <p class="hint">Arraste um checkpoint para salvar a posição em pixels. Clique no mapa quando estiver posicionando um nó novo.</p>
                    </div>
                    <div class="map-stage" id="floor-map" role="application" aria-label="Editor da planta"></div>
                </section>

                <div class="side-stack">
                    <form class="card" id="form-checkpoint">
                        <h2>Novo checkpoint</h2>
                        <label class="form-group" for="checkpoint-name">
                            Nome
                            <input id="checkpoint-name" type="text" maxlength="80" required placeholder="Laboratório">
                        </label>
                        <button type="submit" class="btn btn-primary">Cadastrar nó</button>
                    </form>

                    <form class="card" id="form-edge">
                        <h2>Nova conexão</h2>
                        <label class="form-group" for="edge-source">
                            Origem
                            <select id="edge-source" required></select>
                        </label>
                        <label class="form-group" for="edge-target">
                            Destino
                            <select id="edge-target" required></select>
                        </label>
                        <label class="form-group" for="edge-distance">
                            Distância (m)
                            <input id="edge-distance" type="number" min="0.1" step="0.1" required>
                        </label>
                        <label class="form-group" for="edge-heading">
                            Heading do grafo (graus, anti-horário)
                            <input id="edge-heading" type="number" step="1" value="0" required>
                        </label>
                        <p class="hint">Em radianos: <span class="mono" id="edge-rad">0.000</span></p>
                        <button type="submit" class="btn btn-primary">Gravar conexão</button>
                    </form>

                    <section class="card" id="unplaced-card">
                        <h2>Sem posição</h2>
                        <p class="hint">Trajetórias desses nós não entram no mapa até haver pixels.</p>
                        <ul class="warn-list" id="unplaced-list"></ul>
                    </section>
                </div>
            </div>
        </div>
    </main>
    <script src="../vendor/leaflet/leaflet.js"></script>
    <script type="module" src="/src/boot.ts"></script>
    <script type="module" src="/src/pages/editor.ts"></script>
</body>
</html>
