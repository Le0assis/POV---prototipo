<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POV</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/visitor.css">
</head>
<body class="visitor-app" data-app="visitor">
    <div id="visitor-instructions" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <div class="visitor-shell" id="visitor-shell" data-state="E0">
        <header class="visitor-top">
            <div id="route-bar" role="region" aria-label="Rota"></div>
            <div class="visitor-chrome" id="visitor-chrome" role="region" aria-label="Modo e leitura de QR"></div>
        </header>
        <div class="visitor-map">
            <div id="visitor-map" role="application" aria-label="Mapa do prédio"></div>
        </div>
        <div class="visitor-bottom">
            <label class="sr-only" for="search-field">Para onde você quer ir?</label>
            <input id="search-field" class="search-field text-field" type="text" readonly inputmode="none" placeholder="Para onde você quer ir?" aria-label="Para onde você quer ir?" aria-controls="search-sheet-dialog" autocomplete="off">
        </div>
        <div id="visitor-flow" class="visitor-flow" hidden></div>
    </div>
    <div id="search-sheet-root"></div>
    <div id="camera-root"></div>
    <script src="vendor/leaflet/leaflet.js"></script>
    <script type="module" src="js/boot.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
