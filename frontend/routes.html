<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POV — Rotas</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/compass.css">
    <link rel="stylesheet" href="css/routes.css">
</head>
<body>
    <main class="page">
        <header class="page-header">
            <div>
                <h1>Rotas salvas</h1>
                <p class="lede">Teste no corredor ou simule a caminhada sem sair do lugar.</p>
            </div>
            <button type="button" class="btn btn-primary" id="btn-new-route">+ Nova rota</button>
        </header>

        <section class="card step-card">
            <label class="form-group" for="step-length">
                Comprimento do passo (m)
                <input id="step-length" type="number" min="0.40" max="0.95" step="0.01" value="0.70">
            </label>
            <p class="hint" id="step-hint">Usado para estimar os passos e para a simulação.</p>
        </section>

        <section id="routes-list" class="routes-grid" aria-live="polite"></section>
    </main>

    <div class="modal hidden" id="modal-new-route">
        <form class="modal-content" id="form-new-route">
            <h2>Nova rota</h2>
            <label class="form-group" for="new-route-start">
                Origem
                <select id="new-route-start" required></select>
            </label>
            <label class="form-group" for="new-route-end">
                Destino
                <select id="new-route-end" required></select>
            </label>
            <label class="form-group" for="new-route-name">
                Nome (opcional)
                <input id="new-route-name" type="text" maxlength="80" placeholder="Recepção → Laboratório">
            </label>
            <div class="form-actions">
                <button type="button" class="btn btn-ghost" id="btn-cancel-route">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar rota</button>
            </div>
        </form>
    </div>

    <div class="exec hidden" id="exec" role="dialog" aria-modal="true" aria-labelledby="exec-title">
        <div class="exec-top">
            <div>
                <p class="exec-kicker" id="exec-mode">Simulação</p>
                <h2 id="exec-title">Rota</h2>
                <p class="exec-segment" id="exec-segment">—</p>
            </div>
            <button type="button" class="btn btn-ghost" id="exec-close">Fechar</button>
        </div>

        <div class="exec-body">
            <div class="exec-compass" id="exec-compass"></div>

            <div class="exec-side">
                <div class="exec-stats">
                    <div class="kpi">
                        <span class="kpi-label">Passos</span>
                        <span class="kpi-value mono" id="exec-steps">0 / 0</span>
                    </div>
                    <div class="kpi">
                        <span class="kpi-label">Distância</span>
                        <span class="kpi-value mono" id="exec-dist">0.0 / 0.0 m</span>
                    </div>
                    <div class="kpi">
                        <span class="kpi-label">Restante no trecho</span>
                        <span class="kpi-value mono" id="exec-remain">0.0 m</span>
                    </div>
                </div>

                <div class="segbar" id="exec-bar" aria-hidden="true"></div>
                <ol class="node-list" id="exec-nodes"></ol>

                <div class="exec-controls" id="exec-controls">
                    <button type="button" class="btn btn-primary" id="exec-play" aria-pressed="true">Pausar</button>
                    <div class="speed" role="group" aria-label="Velocidade">
                        <button type="button" class="btn btn-ghost" data-speed="1">1×</button>
                        <button type="button" class="btn btn-ghost is-on" data-speed="2">2×</button>
                        <button type="button" class="btn btn-ghost" data-speed="4">4×</button>
                    </div>
                    <label class="sync" for="exec-sync">
                        <input id="exec-sync" type="checkbox">
                        Sincronizar com backend
                    </label>
                </div>

                <button type="button" class="btn btn-danger" id="exec-finish">Finalizar</button>

                <div class="summary hidden" id="exec-summary">
                    <h3>Resumo</h3>
                    <p id="exec-summary-text"></p>
                    <div class="form-actions">
                        <button type="button" class="btn btn-ghost" id="exec-repeat">Repetir</button>
                        <button type="button" class="btn btn-primary" id="exec-summary-close">Fechar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/pages/routes.js"></script>
</body>
</html>
