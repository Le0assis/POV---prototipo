<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
    (function () {
        try {
            var raw = localStorage.getItem('pov.a11y');
            if (!raw) return;
            var prefs = JSON.parse(raw);
            var root = document.documentElement;
            if (prefs && prefs.hc) root.classList.add('hc');
            if (prefs && prefs.fontLg) root.classList.add('font-lg');
            if (prefs && prefs.dark) root.classList.add('dark');
        } catch (e) { /* preferência ausente: segue o tema padrão */ }
    })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POV — Mapa do prédio</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/map.css">
</head>
<body>
    <main class="map-page">
        <div class="map-toolbar">
            <div class="title-row">
                <h1>Mapa do prédio</h1>
            </div>
            <p class="hint">Somente leitura. A linha contínua é a trajetória gravada; o tracejado é conexão sem gravação.</p>
        </div>
        <div class="map-stage" id="floor-map" role="application" aria-label="Planta e trajetórias"></div>
        <p class="hint" id="viewer-note"></p>
    </main>
    <script src="vendor/leaflet/leaflet.js"></script>
    <script type="module" src="/src/boot.ts"></script>
    <script type="module" src="/src/pages/viewer.ts"></script>
</body>
</html>
